<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votar · Pipeline de datos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;700&display=swap">
<style>
  :root{--navy:#030F50;--paper:#F7FAF2;--coral:#F7966B;--gris:#595959;--carril:#EEEEEE;--teal:#7CCCBF}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--navy);font-family:Geologica,system-ui,sans-serif}
  header{background:var(--navy);color:var(--paper);padding:18px 20px;display:flex;align-items:center;gap:12px}
  header img{height:28px}
  header span{margin-left:auto;font-size:13px;color:var(--coral);font-weight:700;letter-spacing:.1em}
  main{padding:24px 20px 40px;max-width:560px;margin:0 auto}
  .bloque{margin-bottom:36px}
  h1{font-size:24px;line-height:1.25;margin:0 0 6px}
  .linea{width:64px;height:2px;background:var(--navy);margin-bottom:20px}
  button.op{display:block;width:100%;min-height:56px;margin:0 0 12px;padding:14px 16px;text-align:left;font:500 17px Geologica,system-ui,sans-serif;color:var(--navy);background:#FFFFFF;border:2px solid var(--navy);border-radius:0;cursor:pointer}
  button.op:active{transform:translateY(1px)}
  button.op[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
  input.libre{display:block;width:100%;min-height:56px;margin:0 0 12px;padding:14px 16px;font:500 17px Geologica,system-ui,sans-serif;color:var(--navy);background:#FFFFFF;border:2px solid var(--navy);border-radius:0}
  button.enviar{text-align:center;background:var(--coral);border-color:var(--coral);font-weight:700}
  .gracias{padding:14px 16px;background:var(--teal);font-weight:500}
  .espera{text-align:center;padding:60px 10px;color:var(--gris);font-size:18px}
  .espera b{display:block;color:var(--navy);font-size:22px;margin-bottom:8px}
</style>
</head>
<body>
<header>
  <img src="assets/logo_tagline_blanco.svg" alt="Equilibrium">
  <span>VOTACIÓN EN VIVO</span>
</header>
<main id="contenido">
  <div class="espera"><b>Ya estás conectado</b>Cuando aparezca una pregunta en la presentación, la vas a ver acá.</div>
</main>

<script src="config.js"></script>
<script src="encuestas.js"></script>
<script>
  const CFG = window.CONFIG_PRESENTACION;
  const URL_VOTOS = CFG.APPS_SCRIPT_URL;
  const params = new URLSearchParams(location.search);
  const fijas = params.get('p');

  // un id al azar por celular, para que un segundo voto reemplace al primero
  let votante;
  try { votante = localStorage.getItem('votante'); } catch (e) {}
  if (!votante) {
    votante = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { localStorage.setItem('votante', votante); } catch (e) {}
  }

  let mostradas = '';

  // dibuja las preguntas indicadas (p1 o p5,p6)
  function mostrar(ids) {
    if (!ids || ids === mostradas) return;
    mostradas = ids;
    const cont = document.getElementById('contenido');
    cont.innerHTML = '';
    ids.split(',').forEach(function (id) {
      const e = window.ENCUESTAS[id];
      if (!e) return;
      const b = document.createElement('section');
      b.className = 'bloque';
      b.innerHTML = '<h1></h1><div class="linea"></div>';
      b.querySelector('h1').textContent = e.pregunta;
      if (e.abierta) {
        // pregunta abierta: un campo de texto y un botón para enviar
        b.insertAdjacentHTML('beforeend', '<input class="libre" type="text" maxlength="60" placeholder="Escribe tu respuesta"><button class="op enviar" type="button">Enviar</button>');
        const campo = b.querySelector('.libre');
        const enviar = function () {
          const texto = normalizar(campo.value);
          if (texto) votar(id, texto, b, b.querySelector('.enviar'));
        };
        b.querySelector('.enviar').addEventListener('click', enviar);
        campo.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') enviar(); });
      }
      e.opciones.forEach(function (texto, i) {
        const boton = document.createElement('button');
        boton.className = 'op';
        boton.type = 'button';
        boton.textContent = texto;
        boton.setAttribute('aria-pressed', 'false');
        boton.addEventListener('click', function () { votar(id, i, b, boton); });
        b.appendChild(boton);
      });
      cont.appendChild(b);
    });
  }

  // una respuesta libre se guarda en minúsculas y sin espacios ni puntos de más,
  // para que "ETL." y "etl" cuenten como la misma
  function normalizar(texto) {
    return texto.toLowerCase().replace(/\s+/g, ' ').trim().replace(/[.!¡¿?]+$/, '').trim().slice(0, 60);
  }

  // manda el voto; text/plain evita el preflight que Apps Script no responde
  function votar(id, opcion, bloque, boton) {
    bloque.querySelectorAll('button.op').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
    boton.setAttribute('aria-pressed', 'true');
    let aviso = bloque.querySelector('.gracias');
    if (!aviso) { aviso = document.createElement('div'); aviso.className = 'gracias'; bloque.appendChild(aviso); }
    aviso.textContent = typeof opcion === 'string'
      ? 'Respuesta enviada. Puedes cambiarla escribiendo otra.'
      : 'Voto enviado. Puedes cambiarlo tocando otra opción.';
    if (!URL_VOTOS) return;
    fetch(URL_VOTOS, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'votar', p: id, opcion: String(opcion), votante: votante })
    });
  }

  // sin ?p= el celular sigue la pregunta que está en pantalla
  function seguir() {
    if (!URL_VOTOS) return;
    fetch(URL_VOTOS + '?accion=activa')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.activa) { mostrar(String(d.activa)); return; }
        // la presentación cerró la votación: se avisa y se espera la próxima
        if (mostradas) {
          mostradas = '';
          document.getElementById('contenido').innerHTML = '<div class="espera"><b>Votación cerrada</b>Mira el resultado en pantalla. La próxima pregunta aparece acá sola.</div>';
        }
      })
      .catch(function () {});
  }

  if (fijas) { mostrar(fijas); }
  else { seguir(); setInterval(seguir, CFG.INTERVALO_MS); }
</script>
</body>
</html>
