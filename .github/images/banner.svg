<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="DataOps Blueprint">
  <style>
    .t   { font: 700 58px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #FFFFFF; }
    .sub { font: 400 19px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #D1FAE5; }
    .ten { font: 400 19px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #6EE7B7; opacity: .85; }
    .lbl { font: 600 15px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #ECFDF5; }
    .mini{ font: 600 13px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #D1FAE5; }
    .sep { font: 400 20px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #6EE7B7; }

    /* los cuatro bloques se encienden en orden, cada 1 s */
    .pil { fill: #065F46; stroke: #6EE7B7; stroke-opacity: .5; animation: encender 4s infinite; }
    .p2 { animation-delay: 1s; } .p3 { animation-delay: 2s; } .p4 { animation-delay: 3s; }
    @keyframes encender {
      0%, 30%, 100% { fill: #065F46; stroke: #6EE7B7; }
      8%, 22%       { fill: #F59E0B; stroke: #FBBF24; }
    }

    /* el plano del ícono se dibuja y se borra */
    .traza { stroke-dasharray: 260; animation: dibujar 4s ease-in-out infinite; }
    @keyframes dibujar { 0% { stroke-dashoffset: 260; } 50%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -260; } }

    /* los registros titilan en ola */
    .reg { animation: titilar 3s ease-in-out infinite; }
    @keyframes titilar { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

    /* las barras del avance crecen desde abajo */
    .barra { transform-box: fill-box; transform-origin: bottom; animation: crecer 4s ease-out infinite; }
    @keyframes crecer { 0% { transform: scaleY(.1); } 45%, 85% { transform: scaleY(1); } 100% { transform: scaleY(.1); } }

    @media (prefers-reduced-motion: reduce) {
      .pil, .traza, .reg, .barra { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset=".55" stop-color="#065F46"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <pattern id="grilla" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#6EE7B7" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <!-- fondo con la grilla de un plano -->
  <rect width="1200" height="340" rx="28" fill="url(#fondo)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grilla)"/>

  <!-- ícono: un plano que se dibuja -->
  <g transform="translate(64 78)">
    <rect width="120" height="120" rx="18" fill="#064E3B" stroke="#FBBF24" stroke-width="3"/>
    <path d="M20 40H100M20 80H100M40 20V100M80 20V100" stroke="#FBBF24" stroke-opacity=".25" stroke-width="2"/>
    <path class="traza" d="M24 96 L40 80 L40 40 L80 40 L80 80 L100 60" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="60" r="6" fill="#FBBF24"/>
  </g>
  <text class="mini" x="124" y="228" text-anchor="middle">plantilla en R</text>

  <!-- título y subtítulos -->
  <text class="t" x="230" y="128">DataOps Blueprint</text>
  <text class="sub" x="232" y="166">La estructura y el flujo de datos de nuestros proyectos</text>
  <text class="ten" x="232" y="194">auditoría · limpieza · Sheets · Drive · GitHub Actions</text>

  <!-- los cuatro bloques del proceso -->
  <g>
    <rect class="pil p1" x="230" y="214" width="83" height="32" rx="16"/>
    <text class="lbl" x="271.5" y="235" text-anchor="middle">Ingesta</text>
    <text class="sep" x="327" y="237" text-anchor="middle">›</text>
    <rect class="pil p2" x="341" y="214" width="92" height="32" rx="16"/>
    <text class="lbl" x="387" y="235" text-anchor="middle">Procesar</text>
    <text class="sep" x="447" y="237" text-anchor="middle">›</text>
    <rect class="pil p3" x="461" y="214" width="92" height="32" rx="16"/>
    <text class="lbl" x="507" y="235" text-anchor="middle">Producir</text>
    <text class="sep" x="567" y="237" text-anchor="middle">›</text>
    <rect class="pil p4" x="581" y="214" width="92" height="32" rx="16"/>
    <text class="lbl" x="627" y="235" text-anchor="middle">Publicar</text>
  </g>

  <!-- un dato que recorre el flujo -->
  <path id="ruta" d="M232 262 H671" stroke="#6EE7B7" stroke-opacity=".25" stroke-width="2" stroke-dasharray="4 6"/>
  <circle r="5" fill="#FBBF24">
    <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#ruta"/></animateMotion>
  </circle>

  <!-- los registros: en ámbar, los que tienen alerta -->
  <g>
    <circle class="reg" cx="236" cy="294" r="5" fill="#6EE7B7" style="animation-delay:0s"/>
    <circle class="reg" cx="254" cy="294" r="5" fill="#6EE7B7" style="animation-delay:.1s"/>
    <circle class="reg" cx="272" cy="294" r="5" fill="#FBBF24" style="animation-delay:.2s"/>
    <circle class="reg" cx="290" cy="294" r="5" fill="#6EE7B7" style="animation-delay:.3s"/>
    <circle class="reg" cx="308" cy="294" r="5" fill="#6EE7B7" style="animation-delay:.4s"/>
    <circle class="reg" cx="326" cy="294" r="5" fill="#6EE7B7" style="animation-delay:.5s"/>
    <circle class="reg" cx="344" cy="294" r="5" fill="#FBBF24" style="animation-delay:.6s"/>
    <circle class="reg" cx="362" cy="294" r="5" fill="#6EE7B7" style="animation-delay:.7s"/>
    <circle class="reg" cx="380" cy="294" r="5" fill="#6EE7B7" style="animation-delay:.8s"/>
    <circle class="reg" cx="398" cy="294" r="5" fill="#6EE7B7" style="animation-delay:.9s"/>
    <circle class="reg" cx="416" cy="294" r="5" fill="#6EE7B7" style="animation-delay:1s"/>
    <circle class="reg" cx="434" cy="294" r="5" fill="#FBBF24" style="animation-delay:1.1s"/>
    <circle class="reg" cx="452" cy="294" r="5" fill="#6EE7B7" style="animation-delay:1.2s"/>
    <circle class="reg" cx="470" cy="294" r="5" fill="#6EE7B7" style="animation-delay:1.3s"/>
    <circle class="reg" cx="488" cy="294" r="5" fill="#6EE7B7" style="animation-delay:1.4s"/>
  </g>
  <text class="mini" x="506" y="299">registros · en ámbar, con alerta</text>

  <!-- tarjeta: el avance del campo -->
  <g transform="translate(850 48)">
    <rect width="290" height="244" rx="18" fill="#064E3B" fill-opacity=".75" stroke="#6EE7B7" stroke-opacity=".35"/>
    <text class="mini" x="20" y="32">avance del campo, por día</text>
    <line x1="20" y1="208" x2="270" y2="208" stroke="#6EE7B7" stroke-opacity=".4"/>
    <rect class="barra" x="30"  y="168" width="26" height="40"  rx="4" fill="#6EE7B7" style="animation-delay:0s"/>
    <rect class="barra" x="68"  y="146" width="26" height="62"  rx="4" fill="#6EE7B7" style="animation-delay:.15s"/>
    <rect class="barra" x="106" y="128" width="26" height="80"  rx="4" fill="#6EE7B7" style="animation-delay:.3s"/>
    <rect class="barra" x="144" y="112" width="26" height="96"  rx="4" fill="#FBBF24" style="animation-delay:.45s"/>
    <rect class="barra" x="182" y="92"  width="26" height="116" rx="4" fill="#6EE7B7" style="animation-delay:.6s"/>
    <rect class="barra" x="220" y="70"  width="26" height="138" rx="4" fill="#6EE7B7" style="animation-delay:.75s"/>
    <path d="M43 160 L81 138 L119 120 L157 104 L195 84 L233 62" fill="none" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 4"/>
    <text class="mini" x="20" y="230">meta de la cuota</text>
  </g>
</svg>
