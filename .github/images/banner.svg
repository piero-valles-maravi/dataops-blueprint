<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='340' viewBox='0 0 1200 340' role='img' aria-label='DataOps Blueprint'>
<style>
.t{font:700 58px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#FFFFFF}
.sub{font:400 19px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#D1FAE5}
.ten{font:400 19px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#6EE7B7}
.kick{font:700 13px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#FBBF24;letter-spacing:.14em}
.h2{font:700 30px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#FFFFFF}
.lbl{font:600 15px Segoe UI, Ubuntu, system-ui, sans-serif}
.mini{font:600 13px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#D1FAE5}
.txt{font:400 15px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#D1FAE5}
.peq{font:400 13px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#D1FAE5}
.mono{font:400 13px ui-monospace, Consolas, monospace;fill:#FBBF24}
.scan{animation:scan 7s linear infinite}@keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
.traza{stroke-dasharray:300;animation:draw 4.5s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:300}45%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-300}}
.late{transform-box:fill-box;transform-origin:center;animation:late 1.8s ease-out infinite}@keyframes late{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.sube{animation:sube .8s ease-out both}@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pil{fill:#065F46;stroke:#6EE7B7;stroke-opacity:.45;stroke-width:1.5;animation:pil 6s infinite}@keyframes pil{0%,26%,100%{fill:#065F46;stroke:#6EE7B7}6%,20%{fill:#F59E0B;stroke:#FBBF24}}
.pilt{fill:#ECFDF5;animation:pilt 6s infinite}@keyframes pilt{0%,26%,100%{fill:#ECFDF5}6%,20%{fill:#064E3B}}
.avance{transform-box:fill-box;transform-origin:left;animation:avance 6s linear infinite}@keyframes avance{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.viaja{animation:viaja 6s linear infinite}@keyframes viaja{from{transform:translateX(0)}to{transform:translateX(443px)}}
.cinta{animation:cinta 1.8s linear infinite}@keyframes cinta{from{transform:translateX(0)}to{transform:translateX(-36px)}}
.reg{animation:reg 2.4s ease-in-out infinite}@keyframes reg{0%,100%{opacity:.35}50%{opacity:1}}
.barra{transform-box:fill-box;transform-origin:bottom;animation:barra 4.5s ease-out infinite}@keyframes barra{0%{transform:scaleY(.08)}40%,85%{transform:scaleY(1)}100%{transform:scaleY(.08)}}
.meta{stroke-dasharray:260;animation:meta 4.5s ease-out infinite}@keyframes meta{0%{stroke-dashoffset:260}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:260}}
.cuenta{animation:cuenta 4.5s ease-out infinite}@keyframes cuenta{0%{opacity:0}35%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id='luz' x1='0' x2='1'><stop offset='0' stop-color='#6EE7B7' stop-opacity='0'/><stop offset='.5' stop-color='#6EE7B7' stop-opacity='.12'/><stop offset='1' stop-color='#6EE7B7' stop-opacity='0'/></linearGradient>
<linearGradient id='brillo' gradientUnits='userSpaceOnUse' x1='-400' y1='0' x2='-100' y2='0'><stop offset='0' stop-color='#FFFFFF'/><stop offset='.5' stop-color='#FDE68A'/><stop offset='1' stop-color='#FFFFFF'/>
<animate attributeName='x1' values='-400;900;900' keyTimes='0;.6;1' dur='5s' repeatCount='indefinite'/><animate attributeName='x2' values='-100;1200;1200' keyTimes='0;.6;1' dur='5s' repeatCount='indefinite'/></linearGradient>
<linearGradient id='progreso' x1='0' x2='1'><stop offset='0' stop-color='#6EE7B7'/><stop offset='1' stop-color='#FBBF24'/></linearGradient>
<clipPath id='cintaclip'><rect x='232' y='284' width='270' height='16'/></clipPath>
</defs>
