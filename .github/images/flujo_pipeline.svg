<text x='990' y='376' text-anchor='middle' class='ruta' style='animation-delay:7s'>outputs/08</text>
<circle cx='1120' cy='260' r='38' fill='none' stroke='#FBBF24' stroke-width='2' class='eco' style='animation-delay:8s'/>
<circle cx='1120' cy='260' r='38' stroke-width='2' class='nodo' style='animation-delay:8s'/>
<text x='1120' y='269' text-anchor='middle' class='nodot' style='animation-delay:8s'>09</text>
<text x='1120' y='330' text-anchor='middle' class='etq' style='animation-delay:8s'>publish</text>
<text x='1120' y='352' text-anchor='middle' class='peq' style='opacity:.85'>Sheets y Drive</text>
<text x='1120' y='376' text-anchor='middle' class='ruta' style='animation-delay:8s'>destino</text>
<g class='viaja'><circle cx='80' cy='260' r='16' fill='#FBBF24' fill-opacity='.25'/><circle cx='80' cy='260' r='9' fill='#FBBF24'/></g>
<circle cx='53' cy='482' r='5' fill='#FBBF24'/>
<text x='68' y='487' style='font:400 14px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#D1FAE5'>Corre a mano con <tspan style='font-family:ui-monospace, Consolas, monospace;fill:#FDE68A'>completo.yml</tspan> o en local con <tspan style='font-family:ui-monospace, Consolas, monospace;fill:#FDE68A'>00_master.R</tspan>. Las etapas que no se usan se borran sin correr los números.</text>
</g></svg>
