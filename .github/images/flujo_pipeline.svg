<text x='1120' y='155' text-anchor='middle' style='font:700 13px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#ECFDF5;letter-spacing:.12em'>PUBLICAR</text>
<rect x='80' y='258' width='1040' height='4' rx='2' fill='#6EE7B7' fill-opacity='.18'/>
<rect class='avance' x='80' y='258' width='1040' height='4' rx='2' fill='url(#progreso)'/>
<circle cx='80' cy='260' r='38' fill='none' stroke='#FBBF24' stroke-width='2' class='eco' style='animation-delay:0s'/>
<circle cx='80' cy='260' r='38' stroke-width='2' class='nodo' style='animation-delay:0s'/>
<text x='80' y='269' text-anchor='middle' class='nodot' style='animation-delay:0s'>01</text>
<text x='80' y='330' text-anchor='middle' class='etq' style='animation-delay:0s'>import</text>
<text x='80' y='352' text-anchor='middle' class='peq' style='opacity:.85'>trae cada fuente</text>
<text x='80' y='376' text-anchor='middle' class='ruta' style='animation-delay:0s'>01_raw</text>
