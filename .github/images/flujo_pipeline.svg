<text x='340' y='269' text-anchor='middle' class='nodot' style='animation-delay:2s'>03</text>
<text x='340' y='330' text-anchor='middle' class='etq' style='animation-delay:2s'>clean</text>
<text x='340' y='352' text-anchor='middle' class='peq' style='opacity:.85'>corrige y limpia</text>
<text x='340' y='376' text-anchor='middle' class='ruta' style='animation-delay:2s'>03_clean</text>
<circle cx='470' cy='260' r='38' fill='none' stroke='#FBBF24' stroke-width='2' class='eco' style='animation-delay:3s'/>
<circle cx='470' cy='260' r='38' stroke-width='2' class='nodo' style='animation-delay:3s'/>
<text x='470' y='269' text-anchor='middle' class='nodot' style='animation-delay:3s'>04</text>
<text x='470' y='330' text-anchor='middle' class='etq' style='animation-delay:3s'>enrich</text>
<text x='470' y='352' text-anchor='middle' class='peq' style='opacity:.85'>agrega info externa</text>
<text x='470' y='376' text-anchor='middle' class='ruta' style='animation-delay:3s'>04_enrich</text>
<circle cx='600' cy='260' r='38' fill='none' stroke='#FBBF24' stroke-width='2' class='eco' style='animation-delay:4s'/>
<circle cx='600' cy='260' r='38' stroke-width='2' class='nodo' style='animation-delay:4s'/>
<text x='600' y='269' text-anchor='middle' class='nodot' style='animation-delay:4s'>05</text>
<text x='600' y='330' text-anchor='middle' class='etq' style='animation-delay:4s'>integrate</text>
<text x='600' y='352' text-anchor='middle' class='peq' style='opacity:.85'>une fuentes y rondas</text>
<text x='600' y='376' text-anchor='middle' class='ruta' style='animation-delay:4s'>05_integrate</text>
<circle cx='730' cy='260' r='38' fill='none' stroke='#FBBF24' stroke-width='2' class='eco' style='animation-delay:5s'/>
<circle cx='730' cy='260' r='38' stroke-width='2' class='nodo' style='animation-delay:5s'/>
<text x='730' y='269' text-anchor='middle' class='nodot' style='animation-delay:5s'>06</text>
