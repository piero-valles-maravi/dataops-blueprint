<circle cx='210' cy='260' r='38' stroke-width='2' class='nodo' style='animation-delay:1s'/>
<text x='210' y='269' text-anchor='middle' class='nodot' style='animation-delay:1s'>02</text>
<text x='210' y='330' text-anchor='middle' class='etq' style='animation-delay:1s'>audit</text>
<text x='210' y='352' text-anchor='middle' class='peq' style='opacity:.85'>marca alertas</text>
<text x='210' y='376' text-anchor='middle' class='ruta' style='animation-delay:1s'>02_audit</text>
<circle cx='340' cy='260' r='38' fill='none' stroke='#FBBF24' stroke-width='2' class='eco' style='animation-delay:2s'/>
