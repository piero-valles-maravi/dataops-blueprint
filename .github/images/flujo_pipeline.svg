<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='520' viewBox='0 0 1200 520' role='img' aria-label='El pipeline completo en nueve etapas'>
<style>
.t{font:700 58px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#FFFFFF}
.sub{font:400 19px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#D1FAE5}
.ten{font:400 19px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#6EE7B7}
.kick{font:700 13px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#FBBF24;letter-spacing:.14em}
.h2{font:700 30px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#FFFFFF}
.lbl{font:600 15px Segoe UI, Ubuntu, system-ui, sans-serif}
.mini{font:600 13px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#D1FAE5}
.txt{font:400 15px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#D1FAE5}
.peq{font:400 13px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#D1FAE5}
.mono{font:400 13px ui-monospace, Consolas, monospace;fill:#FBBF24}
.nodo{fill:#064E3B;stroke:#6EE7B7;stroke-opacity:.5;animation:nodo 9s ease-in-out infinite}@keyframes nodo{0%,12%,100%{fill:#064E3B;stroke:#6EE7B7;stroke-opacity:.5}2%,9%{fill:#FBBF24;stroke:#FDE68A;stroke-opacity:1}}
.nodot{font:700 24px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#D1FAE5;animation:nodot 9s ease-in-out infinite}@keyframes nodot{0%,12%,100%{fill:#D1FAE5}2%,9%{fill:#064E3B}}
.eco{opacity:0;transform-box:fill-box;transform-origin:center;animation:eco 9s ease-out infinite}@keyframes eco{0%{transform:scale(1);opacity:.8}8%{transform:scale(1.9);opacity:0}100%{opacity:0}}
.etq{font:700 16px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#FFFFFF;animation:etq 9s ease-in-out infinite}@keyframes etq{0%,12%,100%{opacity:.6}2%,9%{opacity:1}}
.ruta{font:400 12px ui-monospace, Consolas, monospace;fill:#6EE7B7;animation:ruta 9s ease-in-out infinite}@keyframes ruta{0%,12%,100%{fill:#6EE7B7}2%,9%{fill:#FBBF24}}
.avance{transform-box:fill-box;transform-origin:left;animation:avance 9s linear infinite}@keyframes avance{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.viaja{animation:viaja 9s linear infinite}@keyframes viaja{from{transform:translateX(0)}to{transform:translateX(1040px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><linearGradient id='progreso' x1='0' x2='1'><stop offset='0' stop-color='#6EE7B7'/><stop offset='1' stop-color='#FBBF24'/></linearGradient></defs>
<defs>
<linearGradient id='fondo' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#064E3B'/><stop offset='.55' stop-color='#065F46'/><stop offset='1' stop-color='#1E3A8A'/></linearGradient>
<pattern id='grilla' width='24' height='24' patternUnits='userSpaceOnUse'><path d='M24 0H0V24' fill='none' stroke='#6EE7B7' stroke-opacity='.07'/></pattern>
<clipPath id='marco'><rect width='1200' height='520' rx='24'/></clipPath>
</defs>
<g clip-path='url(#marco)'>
<rect width='1200' height='520' fill='url(#fondo)'/>
<rect width='1200' height='520' fill='url(#grilla)'/>
<text x='48' y='48' class='kick'>EL PIPELINE COMPLETO</text>
<text x='48' y='88' class='h2'>Nueve etapas: cada una lee la anterior y escribe solo en su carpeta</text>
<rect x='22' y='132' width='116' height='36' rx='10' fill='#064E3B' fill-opacity='0.85' stroke='#6EE7B7' stroke-opacity='.35'/>
<text x='80' y='155' text-anchor='middle' style='font:700 13px Segoe UI, Ubuntu, system-ui, sans-serif;fill:#ECFDF5;letter-spacing:.12em'>INGESTA</text>
