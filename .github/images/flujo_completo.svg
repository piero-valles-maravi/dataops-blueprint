<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="Flujo completo: ingesta, procesar, producir y publicar">
<defs>
  <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#064E3B"/><stop offset="0.55" stop-color="#065F46"/><stop offset="1" stop-color="#1E3A8A"/>
  </linearGradient>
</defs>
<style>
  .t   { font: 700 26px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #FFFFFF; }
  .sub { font: 400 15px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #D1FAE5; }
  .blk { font: 700 17px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #FFFFFF; }
  .num { font: 700 15px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #064E3B; }
  .nom { font: 400 12px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #065F46; }
  .lbl { font: 600 14px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #FBBF24; }
  .dst { font: 600 13px 'Segoe UI', Ubuntu, system-ui, sans-serif; fill: #064E3B; }
</style>
<rect width="1200" height="350" rx="24" fill="url(#fondo)"/>
<text x="40" y="48" class="t">Flujo completo</text>
<text x="40" y="72" class="sub">De la fuente a la entrega, en cuatro bloques · daily.yml</text>
<rect x="40" y="92" width="200" height="200" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#D1FAE5" stroke-opacity="0.35"/>
<rect x="40" y="92" width="200" height="200" rx="16" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.164;0.179;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="58" y="124" class="blk">1. Ingesta</text>
<rect x="70" y="140" width="140" height="44" rx="10" fill="#ECFDF5"/>
<text x="140" y="159" text-anchor="middle" class="num">01</text>
<text x="140" y="176" text-anchor="middle" class="nom">import</text>
<rect x="270" y="92" width="300" height="200" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#D1FAE5" stroke-opacity="0.35"/>
<rect x="270" y="92" width="300" height="200" rx="16" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.190;0.205;0.458;0.473;1" dur="8s" repeatCount="indefinite"/></rect>
