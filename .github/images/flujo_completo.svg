<text x="420" y="275" text-anchor="middle" class="nom">indicators</text>
<rect x="600" y="92" width="260" height="200" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#D1FAE5" stroke-opacity="0.35"/>
<rect x="600" y="92" width="260" height="200" rx="16" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.485;0.500;0.717;0.732;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="618" y="124" class="blk">3. Producir</text>
<rect x="660" y="140" width="140" height="44" rx="10" fill="#ECFDF5"/>
<text x="730" y="159" text-anchor="middle" class="num">07</text>
<text x="730" y="176" text-anchor="middle" class="nom">analysis</text>
<rect x="660" y="196" width="140" height="44" rx="10" fill="#ECFDF5"/>
