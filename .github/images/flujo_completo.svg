<text x="350" y="171" text-anchor="middle" class="nom">audit</text>
<rect x="430" y="135" width="120" height="44" rx="10" fill="#ECFDF5"/>
<text x="490" y="154" text-anchor="middle" class="num">03</text>
<text x="490" y="171" text-anchor="middle" class="nom">clean</text>
<rect x="290" y="187" width="120" height="44" rx="10" fill="#ECFDF5"/>
<text x="350" y="206" text-anchor="middle" class="num">04</text>
<text x="350" y="223" text-anchor="middle" class="nom">enrich</text>
<rect x="430" y="187" width="120" height="44" rx="10" fill="#ECFDF5"/>
<text x="490" y="206" text-anchor="middle" class="num">05</text>
<text x="490" y="223" text-anchor="middle" class="nom">integrate</text>
<rect x="360" y="239" width="120" height="44" rx="10" fill="#ECFDF5"/>
