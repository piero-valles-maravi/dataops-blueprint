<text x="730" y="232" text-anchor="middle" class="nom">products</text>
<rect x="890" y="92" width="270" height="200" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#D1FAE5" stroke-opacity="0.35"/>
<rect x="890" y="92" width="270" height="200" rx="16" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.744;0.759;0.985;0.993;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="908" y="124" class="blk">4. Publicar</text>
<rect x="955" y="140" width="140" height="44" rx="10" fill="#ECFDF5"/>
<text x="1025" y="159" text-anchor="middle" class="num">09</text>
<text x="1025" y="176" text-anchor="middle" class="nom">publish</text>
<line x1="40" y1="322" x2="1160" y2="322" stroke="#6EE7B7" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
<circle r="9" fill="#FBBF24"><animateMotion path="M40 322 H1160" dur="8s" repeatCount="indefinite"/></circle>
<circle r="16" fill="#FBBF24" fill-opacity="0.25"><animateMotion path="M40 322 H1160" dur="8s" repeatCount="indefinite"/></circle>
