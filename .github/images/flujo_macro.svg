<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="El proceso en cuatro bloques: ingesta, procesar, producir y publicar">
<defs><linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#064E3B"/><stop offset="0.55" stop-color="#065F46"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
<marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6EE7B7"/></marker></defs>
<style>
.t{font:700 26px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#FFFFFF}.sub{font:400 15px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#D1FAE5}
.big{font:800 34px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#FBBF24}.blk{font:700 21px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#FFFFFF}.txt{font:400 14px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#D1FAE5}
.et{font:600 13px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#FBBF24}.num{font:700 15px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#064E3B}.nom{font:400 12px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#065F46}
.lbl{font:600 14px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#FBBF24}.dst{font:600 13px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#064E3B}.dat{font:400 12px 'Segoe UI', Ubuntu, system-ui, sans-serif;fill:#A7F3D0}
.flujo{stroke-dasharray:6 8;animation:corre 1.2s linear infinite}@keyframes corre{to{stroke-dashoffset:-28}}
</style>
<rect width="1200" height="330" rx="24" fill="url(#fondo)"/>
<text x="40" y="48" class="t">El proceso de un vistazo</text>
<text x="40" y="72" class="sub">Todo proyecto pasa por los mismos cuatro bloques, de la fuente al destino</text>
<rect x="40" y="100" width="245" height="190" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#D1FAE5" stroke-opacity="0.35"/>
<rect x="40" y="100" width="245" height="190" rx="18" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.238;0.250;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="62" y="150" class="big">1</text>
<text x="98" y="145" class="blk">Ingesta</text>
<text x="62" y="192" class="txt">Traer los datos de cada</text>
<text x="62" y="213" class="txt">fuente, tal cual llegan</text>
<text x="62" y="260" class="et">etapa 01</text>
<line x1="291" y1="195" x2="326" y2="195" stroke="#6EE7B7" stroke-width="3" class="flujo" marker-end="url(#punta)"/>
<rect x="332" y="100" width="245" height="190" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#D1FAE5" stroke-opacity="0.35"/>
<rect x="332" y="100" width="245" height="190" rx="18" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.238;0.250;0.488;0.500;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="354" y="150" class="big">2</text>
<text x="390" y="145" class="blk">Procesar</text>
<text x="354" y="192" class="txt">Auditar, limpiar, enriquecer</text>
<text x="354" y="213" class="txt">e integrar: la base final</text>
<text x="354" y="260" class="et">etapas 02 a 06</text>
<line x1="583" y1="195" x2="618" y2="195" stroke="#6EE7B7" stroke-width="3" class="flujo" marker-end="url(#punta)"/>
<rect x="624" y="100" width="245" height="190" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#D1FAE5" stroke-opacity="0.35"/>
<rect x="624" y="100" width="245" height="190" rx="18" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.488;0.500;0.738;0.750;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="646" y="150" class="big">3</text>
<text x="682" y="145" class="blk">Producir</text>
<text x="646" y="192" class="txt">Analizar y armar lo que</text>
<text x="646" y="213" class="txt">mira o recibe una persona</text>
<text x="646" y="260" class="et">etapas 07 y 08</text>
<line x1="875" y1="195" x2="910" y2="195" stroke="#6EE7B7" stroke-width="3" class="flujo" marker-end="url(#punta)"/>
<rect x="916" y="100" width="245" height="190" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#D1FAE5" stroke-opacity="0.35"/>
<rect x="916" y="100" width="245" height="190" rx="18" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.738;0.750;0.988;0.994;1" dur="8s" repeatCount="indefinite"/></rect>
<text x="938" y="150" class="big">4</text>
<text x="974" y="145" class="blk">Publicar</text>
<text x="938" y="192" class="txt">Llevar cada cosa a</text>
<text x="938" y="213" class="txt">donde se mira</text>
<text x="938" y="260" class="et">etapa 09</text>
</svg>
