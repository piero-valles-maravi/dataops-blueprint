# Flujo completo + respaldo: una vez al día.
# 01_import → … → 06_wrangle → 08_products_* → 09_publish. 07_analysis no corre
# acá: se corre a mano al cierre. 08_monitoring tampoco: es del flujo de
# monitoreo (hourly.yml).
#
# No usa "schedule": lo dispara tools/apps_script/disparador.gs con
# workflow_dispatch. También se puede correr a mano desde la pestaña Actions.
#
# Regla: el workflow no tiene lógica. Un paso por script, en el orden del flujo.
# Las etapas que el proyecto no usa se borran de esta lista.

name: daily

on:
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Lima
      NOMBRE_PROYECTO: ${{ secrets.NOMBRE_PROYECTO }}
      GOOGLE_SERVICE_ACCOUNT_KEY: .secrets/cuenta_servicio.json
      SURVEYCTO_SERVER: ${{ secrets.SURVEYCTO_SERVER }}
      SURVEYCTO_USERNAME: ${{ secrets.SURVEYCTO_USERNAME }}
      SURVEYCTO_PASSWORD: ${{ secrets.SURVEYCTO_PASSWORD }}
      GSHEET_ID_DASHBOARD: ${{ secrets.GSHEET_ID_DASHBOARD }}
      GDRIVE_ID_RAW: ${{ secrets.GDRIVE_ID_RAW }}
      GDRIVE_ID_AUDIT: ${{ secrets.GDRIVE_ID_AUDIT }}
      GDRIVE_ID_CLEAN: ${{ secrets.GDRIVE_ID_CLEAN }}
      GDRIVE_ID_ENRICH: ${{ secrets.GDRIVE_ID_ENRICH }}
      GDRIVE_ID_INTEGRATE: ${{ secrets.GDRIVE_ID_INTEGRATE }}
      GDRIVE_ID_FINAL: ${{ secrets.GDRIVE_ID_FINAL }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Escribir la clave de la cuenta de servicio
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > .secrets/cuenta_servicio.json

      - name: 01_import_encuesta
        run: Rscript src/01_import/01_import_encuesta.R

      - name: 01_import_registro
        run: Rscript src/01_import/01_import_registro.R

      - name: 01_import_validacion
        run: Rscript src/01_import/01_import_validacion.R

      - name: 02_audit_encuesta
        run: Rscript src/02_audit/02_audit_encuesta.R

      - name: 02_audit_registro
        run: Rscript src/02_audit/02_audit_registro.R

      - name: 03_clean_encuesta
        run: Rscript src/03_clean/03_clean_encuesta.R

      - name: 03_clean_registro
        run: Rscript src/03_clean/03_clean_registro.R

      - name: 04_enrich_encuesta
        run: Rscript src/04_enrich/04_enrich_encuesta.R

      - name: 04_enrich_registro
        run: Rscript src/04_enrich/04_enrich_registro.R

      - name: 05_integrate_1_apilar
        run: Rscript src/05_integrate/05_integrate_1_apilar.R

      - name: 05_integrate_2_entidades
        run: Rscript src/05_integrate/05_integrate_2_entidades.R

      - name: 06_wrangle_indicadores
        run: Rscript src/06_wrangle/06_wrangle_indicadores.R

      - name: 06_wrangle_entrega
        run: Rscript src/06_wrangle/06_wrangle_entrega.R

      - name: 08_products_informe
        run: Rscript src/08_products/08_products_informe.R

      - name: 08_products_entrega
        run: Rscript src/08_products/08_products_entrega.R

      - name: 09_publish_sheets
        run: Rscript src/09_publish/09_publish_sheets.R

      - name: 09_publish_drive
        run: Rscript src/09_publish/09_publish_drive.R

      - name: Borrar la clave
        if: always()
        run: rm -f .secrets/cuenta_servicio.json
